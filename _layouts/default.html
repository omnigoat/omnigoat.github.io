<!doctype html>
<html class="dark">
	<head>
		<meta charset="utf-8">
		<title>{{ page.title }}</title>
		<link rel="stylesheet" href="/assets/css/styles.css" />
		<link rel="stylesheet" href="/assets/css/syntax.css" />
	</head>
	<body>
		<div class="all-content">
			<div class="left-content">
				<section class="sidebar hide-if-small">
					<div class="sidebar-top-content">
						<div class="sidebar-avatar">
							<a class="avatar" href="/"><img src="/assets/img/avatari.png" /></a>
						</div>
						{% for theme in site.data.themes %}
							<!-- wrap each button in div of its own theme-name, so per-theme styling can affect it -->
							<div class="{{theme}}" style="display: inline;"">
								<button class="select-theme theme-{{theme}}"></button>
							</div>
						{% endfor %}
					</div>
					<div class="sidebar-blurb">
						<a class="author title" href="/" >{{site.author.name}}</a>
						<p class="description">
							writing about programming, rendering, c++, and other things for which one should apologise
						</p>
						<p class="mediasize"></p>
						<p class="navigation">
							<a class="nav_home" href="/" >home</a>
							<a class="nav_posts" href="/posts" >posts</a>
							<a class="nav_about" href="/about">about</a>
						</p>
					</div>
				</section>
			</div>
			<div class="center-content">
				<section class="contents">
					<section class="inner-contents">
						{{ content }}
					</section>
				</section>
			</div>
			<div class="right-content">
				<div class="left-spacer"></div>
				<section class="minimap hide-if-medium">
					<div class="sizer"></div>
					<div class="contents">
						<div class="inner-contents">
							{{ content }}
						</div>
					</div>
					<div class="controller"></div>
				</section>
				<!--<div class="right-spacer"></div>-->
			</div>
		</div>

	</body>

	<script src="/assets/js/minimap.js"></script>
	<script>

	function change_theme(theme_name)
	{
		var html = document.documentElement;
		html.className = '';
		html.classList.add(theme_name);
	}

	</script>
</html>
